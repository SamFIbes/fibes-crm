Listen ${PORT}

# Railway terminates TLS at its edge and talks to Apache over plain HTTP on
# $PORT. Apache's own redirects (the trailing-slash rule in public/.htaccess,
# mod_dir's "/build" -> "/build/") are absolute URLs, and by default Apache
# builds them from its own view: http, the server name and port $PORT, e.g.
# http://www.fibes.io:8080/build/. Build them from the request instead:
# take the host from the Host header and never add the internal port...
UseCanonicalName Off
UseCanonicalPhysicalPort Off

# ...and when the edge says the visitor used https (Railway overwrites
# X-Forwarded-Proto, so clients cannot fake it), rewrite any such
# "http://host[:port]/..." Location to "https://host/...".
SetEnvIf X-Forwarded-Proto "^https$" FIBES_FORWARDED_HTTPS
Header always edit Location "^http://([^/:]+)(:[0-9]+)?(/.*)?$" "https://$1$3" env=FIBES_FORWARDED_HTTPS

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
