Listen ${PORT}

<VirtualHost *:${PORT}>
    # Railway terminates TLS at its edge and talks to Apache over plain HTTP on
    # $PORT. Apache's own redirects (the trailing-slash rule in public/.htaccess,
    # mod_dir's "/build" -> "/build/") are absolute URLs, and by default Apache
    # builds them from its own view: http plus the internal port, e.g.
    # http://www.fibes.io:8080/build/. Visitors only ever reach this container
    # through the https edge, so:
    # - the scheme and default port of self-made URLs are https and 443
    #   (the host name below is only a fallback for requests with no Host);
    # - the host comes from the request's Host header, so any domain works.
    ServerName https://localhost:443
    UseCanonicalName Off
    UseCanonicalPhysicalPort Off

    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
