# Production stack for the FIBES server. This file is complete on its own.
# It does not publish Postgres or Redis. TLS files are mounted only if you add them.
#
#   docker compose -p fibes-prod -f docker-compose.prod.yml up -d --build
#
# Do not point this at a machine you do not own. The app refuses to boot when
# APP_KEY, DB_PASSWORD, or ADMIN_PASSWORD is empty, and it refuses the
# placeholder database passwords change-me, secret, and password.

name: fibes-prod

services:
  app:
    build:
      context: .
      target: production
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      FIBES_RUN_MIGRATIONS: "true"
      FIBES_FILE_SCAN_DRIVER: ${FIBES_FILE_SCAN_DRIVER:-clamav}
      FIBES_CLAMAV_HOST: clamav
      FIBES_CLAMAV_PORT: "3310"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - app
    restart: unless-stopped

  queue:
    build:
      context: .
      target: production
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      FIBES_RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--max-time=3600"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      target: production
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      FIBES_RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fibes}
      POSTGRES_USER: ${DB_USERNAME:-fibes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    command: ["postgres", "-c", "fsync=on", "-c", "synchronous_commit=on", "-c", "full_page_writes=on"]
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fibes} -d ${DB_DATABASE:-fibes}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
    volumes:
      - meilisearch:/meili_data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio:/data
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped

volumes:
  postgres:
  redis:
  meilisearch:
  minio:
