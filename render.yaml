# Render Blueprint for FIBES CRM: one Docker web service + one Postgres 16.
# Render > New > Blueprint > pick this repo. Secrets marked sync: false are asked for in the dashboard.
services:
  - type: web
    name: fibes-crm
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_KEY
        sync: false   # base64:... from `php artisan key:generate --show`
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false   # 12+ chars, upper, lower, number
      - key: ADMIN_NAME
        value: Sam Al-Nakhel
      - key: DATABASE_URL
        fromDatabase:
          name: fibes-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Beirut
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FIBES_FILE_SCAN_DRIVER
        value: "null"

databases:
  - name: fibes-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: fibes
    user: fibes
